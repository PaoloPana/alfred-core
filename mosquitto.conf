# Sample Mosquitto (2.x) configuration for Alfred. See docs/broker.md.
#
# Meant to be a drop-in file: copy it to /etc/mosquitto/conf.d/alfred.conf. The default
# /etc/mosquitto/mosquitto.conf of Debian, Ubuntu and Raspberry Pi OS already enables
# persistence (so queued messages survive a broker restart). If you run Mosquitto with a
# configuration of your own (e.g. in a container), also add:
#   persistence true
#   persistence_location /mosquitto/data/

# Local only (modules and broker on the same machine), no authentication
listener 1883 127.0.0.1
allow_anonymous true

# --- Authentication and access control (recommended when the broker is reachable from the network) ---
# allow_anonymous false
# password_file /etc/mosquitto/alfred.passwd     # mosquitto_passwd -c /etc/mosquitto/alfred.passwd alfred
# acl_file /etc/mosquitto/alfred.acl             # see docs/broker.md for an example

# --- TLS ---
# listener 8883
# cafile   /etc/mosquitto/certs/ca.crt
# certfile /etc/mosquitto/certs/server.crt
# keyfile  /etc/mosquitto/certs/server.key
